<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>财经规划部-每日看板</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: two views under one app bar. 每日新闻 is a reading board that follows the viewer's theme;
   经营看板 is a fixed dark "cockpit": six zone tiles that open into leaders, earnings, markets,
   policy, calendar views. Huawei is always the one highlighted mark in every chart. */
:root {
  --bg: #F3F6F7; --surface: #FFFFFF; --ink: #15202B; --muted: #5A6875; --line: #D9E0E5;
  --accent: #0A6B6B; --accent-soft: #E1F0EF;
  --note-bg: #FFF5DA; --note-label: #7A5600; --note-ink: #33290F;
  --display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --body: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* 经营看板 shares the news palette; --k-* names map to it, plus a few data/status tokens */
  --k-bg: var(--bg); --k-panel: var(--surface); --k-line: var(--line); --k-fg: var(--ink); --k-muted: var(--muted);
  --k-accent: var(--accent); --k-accent-soft: var(--accent-soft);
  --k-panel-2: #F7FAFA; --k-faint: #7C8893; --k-accent-ink: #FFFFFF;
  --k-pos: #13805A; --k-neg: #C2412F; --k-bar: #C9D3DA; --k-bar-hi: #B3C0CA; --k-track: #EEF2F4; --k-area: rgba(10,107,107,.08);
  --k-hi: #C93A33; --k-mid: #A86B00; --k-lo: #7C8893; --k-hi-soft: #FBE7E5; --k-mid-soft: #FFF2D6; --k-lo-soft: #EEF1F3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418; --surface: #151C22; --ink: #E5EBEF; --muted: #93A1AD; --line: #25303A;
    --accent: #55C4BE; --accent-soft: #143231;
    --note-bg: #2A2411; --note-label: #E2C069; --note-ink: #EDE3C4;
    --k-panel-2: #1A232A; --k-faint: #6E7D89; --k-accent-ink: #0E1418;
    --k-pos: #4CC79A; --k-neg: #F27D6B; --k-bar: #34424D; --k-bar-hi: #43535F; --k-track: #1D262D; --k-area: rgba(85,196,190,.10);
    --k-hi: #F0756D; --k-mid: #E2C069; --k-lo: #8A99A6; --k-hi-soft: #3A1F1E; --k-mid-soft: #2A2411; --k-lo-soft: #232B31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418; --surface: #151C22; --ink: #E5EBEF; --muted: #93A1AD; --line: #25303A;
  --accent: #55C4BE; --accent-soft: #143231;
  --note-bg: #2A2411; --note-label: #E2C069; --note-ink: #EDE3C4;
  --k-panel-2: #1A232A; --k-faint: #6E7D89; --k-accent-ink: #0E1418;
  --k-pos: #4CC79A; --k-neg: #F27D6B; --k-bar: #34424D; --k-bar-hi: #43535F; --k-track: #1D262D; --k-area: rgba(85,196,190,.10);
  --k-hi: #F0756D; --k-mid: #E2C069; --k-lo: #8A99A6; --k-hi-soft: #3A1F1E; --k-mid-soft: #2A2411; --k-lo-soft: #232B31;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.75; transition: background .2s; }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- app bar ---------- */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.appbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.switch { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); gap: 2px; }
.switch button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
.switch button[aria-selected="true"] { background: var(--accent); color: #fff; }
.appbar .org { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }

/* ---------- 每日新闻 ---------- */
.news { display: flex; flex-direction: column; gap: 28px; padding-block: 24px 64px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 4vw, 34px); line-height: 1.25; margin: 0; text-wrap: balance; }
.datenav { display: flex; align-items: center; gap: 8px; }
.datenav button, .datenav select { font-family: var(--mono); font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; height: 36px; padding: 0 10px; cursor: pointer; }
.datenav button:disabled { color: var(--muted); cursor: default; opacity: .5; }
.stamp { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.keys { background: var(--surface); border: 1px solid var(--line); padding: 20px 24px; }
.keys h2, .watch h2 { font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
.keys ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.keys li { font-size: 16px; }
.keys li::marker { font-family: var(--mono); color: var(--accent); }
.board-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 36px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 18px; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; color: var(--ink); text-decoration: none; border-radius: 4px; }
.rail nav a:hover { background: var(--accent-soft); }
.rail nav a span { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 10px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.content { min-width: 0; display: flex; flex-direction: column; gap: 40px; }
.sector h2 { font-family: var(--display); font-weight: 700; font-size: 21px; margin: 0 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); scroll-margin-top: 80px; }
.story { padding: 20px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.story h3 { font-size: 17px; line-height: 1.5; font-weight: 650; margin: 0; text-wrap: balance; }
.ntag { display: inline-block; vertical-align: 2px; margin-right: 8px; font-size: 12px; font-weight: 700; line-height: 1.6; padding: 0 8px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.ntag-good { color: var(--k-pos); background: color-mix(in srgb, var(--k-pos) 10%, transparent); }
.ntag-opp { color: var(--accent); background: var(--accent-soft); }
.ntag-risk { color: var(--k-hi); background: var(--k-hi-soft); }
.ntag-comp { color: var(--k-mid); background: var(--k-mid-soft); }
.ntag-watch { color: var(--k-muted); background: var(--k-lo-soft); }
.keys li .ntag { font-size: 11px; }
.story p { margin: 0; }
.note { background: var(--note-bg); color: var(--note-ink); padding: 12px 16px; overflow-wrap: anywhere; }
.ai { max-width: none; min-width: 0; }
.ai summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 600; color: var(--note-label); background: var(--note-bg); border-radius: 4px; padding: 4px 12px; user-select: none; }
.ai summary::-webkit-details-marker { display: none; }
.ai summary::after { content: "▾"; font-size: 11px; transition: transform .15s; }
.ai[open] summary::after { transform: rotate(180deg); }
.ai[open] summary { border-radius: 4px 4px 0 0; }
.ai .note { border-radius: 0 4px 4px 4px; }
.ai-label { display: inline-block; font-size: 13px; font-weight: 600; color: var(--note-label); background: var(--note-bg); border-radius: 4px 4px 0 0; padding: 4px 12px; }
.note p, .k-ai .pts p { margin: 0; max-width: none; }
.note p + p { margin-top: 6px; }
.keys .ai { margin-top: 6px; }
.keys .ai .note { font-size: 14px; }
.k-ai .pts { padding: 12px 14px; background: var(--note-bg); border-radius: 0 6px 6px 6px; color: var(--note-ink); font-size: 14px; line-height: 1.8; }
.k-ai .pts p { padding: 0; background: none; border-radius: 0; }
.k-ai .pts p + p { margin-top: 6px; }
.src { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tbl { max-width: 100%; overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: 14px; min-width: 60%; font-variant-numeric: tabular-nums; }
.tbl caption { text-align: left; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.tbl th, .tbl td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 600; }
.tbl td + td, .tbl th + th { text-align: right; }
.none { color: var(--muted); padding: 16px 0; margin: 0; }
.watch { border-top: 2px solid var(--ink); padding-top: 14px; }
.watch ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.watch li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 12px; }
.watch time { font-family: var(--mono); font-size: 13px; color: var(--accent); padding-top: 2px; }
.empty { background: var(--surface); border: 1px dashed var(--line); padding: 36px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

/* ---------- 经营看板 (cockpit) ---------- */
.cockpit { padding-block: 24px 72px; display: flex; flex-direction: column; gap: 24px; }
.ck-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ck-head h1 { color: var(--k-fg); }
.ck-sub { font-family: var(--mono); font-size: 12px; color: var(--k-muted); letter-spacing: .04em; }
.crumb { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--k-line); color: var(--k-muted); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.crumb:hover { color: var(--k-fg); border-color: var(--k-faint); }
#ck-back { background: var(--k-accent); border-color: var(--k-accent); color: var(--k-accent-ink); font-size: 14px; font-weight: 600; padding: 8px 16px; margin-bottom: 10px; }
#ck-back:hover { color: var(--k-accent-ink); border-color: var(--k-accent); filter: brightness(1.08); }
.ck-float { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: var(--k-accent); color: var(--k-accent-ink); padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.ck-float:hover { filter: brightness(1.08); }
.dm-head { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 700; color: var(--k-fg); line-height: 1.5; }
.dm-pts { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.dm-pts li { font-size: 14px; color: var(--k-fg); line-height: 1.7; }
.bg-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.bg-item { background: var(--k-panel-2); border: 1px solid var(--k-line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bg-t { font-size: 14px; font-weight: 700; color: var(--k-fg); }
.bg-inf { margin: 0; font-size: 14px; line-height: 1.7; color: var(--k-fg); }
.bg-inf b { font-size: 12px; font-weight: 600; color: var(--note-label); background: var(--note-bg); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.bg-more summary { cursor: pointer; font-size: 12px; color: var(--k-muted); list-style: none; }
.bg-more summary::-webkit-details-marker { display: none; }
.bg-more summary::after { content: " ▾"; }
.bg-more[open] summary::after { content: " ▴"; }
.bg-more p { margin: 6px 0 4px; font-size: 13px; color: var(--k-muted); line-height: 1.7; }
.k-label { font-size: 12px; letter-spacing: .12em; color: var(--k-muted); font-weight: 600; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; text-align: left; background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 10px; padding: 18px 18px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 14px; min-height: 168px; transition: border-color .15s, transform .15s, background .15s; }
.tile:hover { border-color: var(--k-accent); transform: translateY(-2px); }
.tile-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tile-name { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--k-accent); }
.tile-tag { font-family: var(--mono); font-size: 11px; color: var(--k-faint); letter-spacing: .06em; }
.upd { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 12px; background: var(--k-lo-soft); color: var(--k-muted); }
.upd::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.upd.on { background: var(--k-accent-soft); color: var(--k-accent); }
.tile-body { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tile-foot { font-size: 12px; color: var(--k-muted); display: flex; justify-content: space-between; }
.tile-foot::after { content: "进入查看 →"; color: var(--k-accent); }
.big { font-family: var(--mono); font-size: 34px; font-weight: 600; line-height: 1.1; color: var(--k-fg); font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; color: var(--k-muted); font-weight: 400; margin-left: 4px; }
.tile-line { font-size: 13px; color: var(--k-muted); line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile-line b { color: var(--k-fg); font-weight: 600; }
.pos { color: var(--k-pos); } .neg { color: var(--k-neg); } .neu { color: var(--k-muted); }
.stack { display: flex; }
.stack .av { width: 36px; height: 36px; font-size: 14px; margin-right: -8px; box-shadow: 0 0 0 2px var(--k-panel); }
.mini-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.mini-list li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; color: var(--k-fg); }
.mini-list .mono { color: var(--k-accent); font-size: 12px; padding-top: 1px; }
.mini-list span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.av { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--k-fg); background: var(--k-accent-soft); border: 1px solid var(--k-line); color: var(--k-accent); flex: none; position: relative; }
.av.is-new { box-shadow: 0 0 0 2px var(--k-panel), 0 0 0 4px var(--k-accent); }

/* leaders */
.leaders { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.l-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.l-card { position: relative; background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 10px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; text-align: center; }
.l-card:hover { background: var(--k-panel-2); }
.l-card[aria-pressed="true"] { border-color: var(--k-accent); background: var(--k-panel-2); }
.l-card .nm { font-size: 14px; font-weight: 600; color: var(--k-fg); line-height: 1.3; }
.l-card .co { font-size: 11px; color: var(--k-muted); line-height: 1.2; }
.badge { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; background: var(--k-accent); color: var(--k-accent-ink); letter-spacing: .04em; }
.dot { position: absolute; top: 8px; left: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--k-neg); }
.star { position: absolute; bottom: 6px; right: 8px; font-size: 12px; color: var(--k-accent); }
.l-detail { background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.l-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.l-head .who { flex: 1; min-width: 0; }
.l-head h2 { font-family: var(--display); font-size: 22px; margin: 0; color: var(--k-fg); }
.l-head .ttl { font-size: 13px; color: var(--k-muted); }
.follow { border: 1px solid var(--k-line); background: transparent; color: var(--k-muted); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.follow[aria-pressed="true"] { border-color: var(--k-accent); color: var(--k-accent); }
.quote { border-top: 1px solid var(--k-line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--k-muted); }
.chip { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--k-line); color: var(--k-muted); white-space: nowrap; }
.chip.new { border-color: var(--k-accent); color: var(--k-accent); }
.q-text { font-size: 17px; line-height: 1.7; color: var(--k-fg); margin: 0; font-family: var(--display); font-weight: 600; }
.q-text.para { font-family: var(--body); font-weight: 400; font-size: 16px; }
.q-orig { font-size: 13px; color: var(--k-muted); font-style: italic; margin: 0; }
.k-ai summary { display: inline-flex; gap: 6px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 600; color: var(--note-label); background: var(--note-bg); border-radius: 4px; padding: 3px 12px; }
.k-ai summary::-webkit-details-marker { display: none; }
.k-ai summary::after { content: "▾"; font-size: 11px; }
.k-ai[open] summary::after { content: "▴"; }
.k-ai p { margin: 0; padding: 12px 14px; background: var(--note-bg); border-radius: 0 6px 6px 6px; color: var(--note-ink); font-size: 14px; line-height: 1.8; }
.k-src { font-size: 12px; color: var(--k-faint); }
.k-src a { color: var(--k-muted); }

/* filters */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--k-line); background: transparent; color: var(--k-muted); border-radius: 16px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--k-accent); color: var(--k-accent-ink); border-color: var(--k-accent); }

/* earnings */
.e-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.e-card { background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.e-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.e-top h3 { margin: 0; font-size: 17px; color: var(--k-fg); }
.e-top h3 span { font-size: 12px; color: var(--k-faint); font-weight: 400; margin-left: 6px; font-family: var(--mono); }
.e-per { font-size: 12px; color: var(--k-muted); font-family: var(--mono); }
.e-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.e-m .lb { font-size: 12px; color: var(--k-muted); }
.e-m .vl { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--k-fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* markets */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--k-line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; color: var(--k-muted); padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--k-fg); border-bottom-color: var(--k-accent); }
.m-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.kpi { background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.kpi .dl { font-family: var(--mono); font-size: 12px; }
.chart { background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 10px; padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.chart h3 { margin: 0; font-size: 15px; color: var(--k-fg); font-weight: 600; }

.chart .cap a { color: var(--k-muted); }
.chart .nt { font-size: 12px; color: var(--k-muted); margin: 0; }
.g-grid { stroke: var(--k-line); stroke-width: 1; }
.g-axis { fill: var(--k-faint); font-family: var(--mono); font-size: 11px; }
.g-bar { fill: var(--k-bar); }

.g-val { fill: var(--k-fg); font-family: var(--mono); font-size: 12px; font-weight: 600; }
.g-tag { font-family: var(--mono); font-size: 10.5px; }
.g-tag.pos { fill: var(--k-pos); } .g-tag.neg { fill: var(--k-neg); } .g-tag.neu { fill: var(--k-faint); }
.g-line { fill: none; stroke: var(--k-accent); stroke-width: 2; }
.g-area { fill: var(--k-area); stroke: none; }
.g-pt { fill: var(--k-accent); stroke: var(--k-panel); stroke-width: 2; }
.g-gap { fill: none; stroke: var(--k-faint); stroke-width: 1; stroke-dasharray: 3 4; }
.hb { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; font-size: 13px; }
.hb-row { display: contents; }
.hb-name { color: var(--k-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { height: 14px; background: var(--k-track); border-radius: 0 4px 4px 0; position: relative; }
.hb-fill { position: absolute; inset: 0 auto 0 0; background: var(--k-bar); border-radius: 0 4px 4px 0; }
.hb-row.hl .hb-fill { background: var(--k-accent); }
.hb-row.hl .hb-name { color: var(--k-accent); font-weight: 600; }
.hb-val { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--k-fg); text-align: right; min-width: 9.5em; }

.rg-track { height: 14px; position: relative; border-radius: 4px; background: var(--k-track); }
.rg-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--k-neg); border-radius: 0; opacity: .8; }
.rg-ext { position: absolute; top: 0; bottom: 0; background: var(--k-neg); opacity: .35; border-radius: 0 4px 4px 0; }

/* policy */
.p-list { display: flex; flex-direction: column; gap: 10px; }
.p-row { background: var(--k-panel); border: 1px solid var(--k-line); border-left: 3px solid var(--k-lo); border-radius: 8px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 8px 24px; }
.p-row.lv-高 { border-left-color: var(--k-hi); }

.p-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.p-title h3 { margin: 0; font-size: 16px; color: var(--k-fg); }
.lv { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
.lv.lv-高 { background: var(--k-hi-soft); color: var(--k-hi); }
.lv.lv-中 { background: var(--k-mid-soft); color: var(--k-mid); }
.lv.lv-低 { background: var(--k-lo-soft); color: var(--k-lo); }
.p-status { margin: 0; font-size: 14px; color: var(--k-fg); }

.p-latest .mono { color: var(--k-faint); margin-right: 6px; }
.p-next { border-left: 1px solid var(--k-line); padding-left: 16px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--k-muted); }

.p-next .cd small { font-size: 12px; color: var(--k-muted); font-weight: 400; margin-left: 2px; }
.p-src { grid-column: 1 / -1; font-size: 12px; color: var(--k-faint); }
.p-src a { color: var(--k-muted); }

/* calendar */
.c-week { display: flex; flex-direction: column; gap: 6px; }
.c-week h3 { margin: 6px 0 2px; font-size: 13px; color: var(--k-muted); font-weight: 600; letter-spacing: .06em; }
.c-row { display: grid; grid-template-columns: 104px 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.c-row .d { font-family: var(--mono); color: var(--k-fg); }
.c-row .d small { color: var(--k-muted); margin-left: 4px; }
.c-row .cd { font-family: var(--mono); font-size: 12px; color: var(--k-accent); }
.c-row .t { color: var(--k-fg); min-width: 0; }
.c-row .t small { color: var(--k-faint); margin-left: 8px; font-size: 12px; }
.c-row.past { opacity: .45; }
.ty-财报 { border-color: currentColor; color: var(--k-pos); }
.ty-政策 { border-color: currentColor; color: var(--k-hi); }
.ty-发布 { border-color: currentColor; color: var(--k-mid); }
.e-fs { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--k-line); background: transparent; color: var(--k-accent); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
.e-fs:hover { border-color: var(--k-accent); }
#fs { border: 1px solid var(--k-line); border-radius: 12px; padding: 0; width: min(780px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--k-panel); color: var(--k-fg); overflow: hidden; }
#fs[open] { display: flex; flex-direction: column; }
#fs::backdrop { background: rgba(10, 15, 20, .5); }
.fs-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 10px; }
.fs-head h3 { margin: 0; font-size: 18px; font-family: var(--display); }
.fs-sub { font-size: 12px; color: var(--k-muted); font-family: var(--mono); margin-top: 2px; }
.fs-close { border: 1px solid var(--k-line); background: transparent; color: var(--k-muted); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 13px; flex: none; }
.fs-tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--k-line); flex: none; }
.fs-tabs button { border: 0; background: transparent; color: var(--k-muted); padding: 8px 12px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
.fs-tabs button[aria-selected="true"] { color: var(--k-fg); border-bottom-color: var(--k-accent); }
.fs-body { padding: 10px 20px 18px; overflow: auto; }
.fs-body table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.fs-body th, .fs-body td { padding: 7px 8px; border-bottom: 1px solid var(--k-line); text-align: left; }
.fs-body th { font-size: 12px; color: var(--k-muted); font-weight: 600; white-space: nowrap; }
.fs-body td + td, .fs-body th + th { text-align: right; font-family: var(--mono); white-space: nowrap; }
.fs-note { font-size: 12px; color: var(--k-muted); line-height: 1.7; margin: 12px 0 4px; }
.fs-src { font-size: 12px; color: var(--k-faint); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.fs-src a { color: var(--k-muted); }
.tag-new { display: inline-block; margin-left: 8px; vertical-align: middle; font-family: var(--body); font-size: 11px; font-weight: 700; line-height: 1.6; padding: 0 8px; border-radius: 10px; background: var(--k-accent); color: var(--k-accent-ink); white-space: nowrap; }
.is-fresh { border-color: var(--k-accent) !important; box-shadow: 0 0 0 1px var(--k-accent); }
.tdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--k-neg); margin-left: 6px; vertical-align: middle; }
.k-foot { font-size: 12px; color: var(--k-faint); line-height: 1.7; border-top: 1px solid var(--k-line); padding-top: 12px; }


/* ---------- 经营看板 · 主题切片 ---------- */
.t-group { display: flex; flex-direction: column; gap: 12px; }
.t-group + .t-group { margin-top: 10px; }
.t-dom { margin: 0; font-size: 13px; letter-spacing: .12em; color: var(--k-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; }
.t-dom::after { content: ""; flex: 1; height: 1px; background: var(--k-line); }
.t-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.t-card { min-height: 150px; gap: 12px; }
.t-card .t-judg { flex: 1; }
.t-card .tile-name { font-size: 18px; }
.t-judg { margin: 0; font-size: 15px; font-weight: 600; color: var(--k-fg); line-height: 1.55; }
.t-kn { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 12px; }
.t-k { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.t-k .lb { font-size: 12px; color: var(--k-muted); line-height: 1.4; }
.t-k .vl { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--k-fg); line-height: 1.3; overflow-wrap: anywhere; }
.t-k .cp { font-size: 12px; color: var(--k-muted); line-height: 1.4; }
.t-k .sr { font-size: 11px; color: var(--k-faint); line-height: 1.4; }
.t-chg { margin: 0; font-size: 13px; color: var(--k-fg); background: var(--k-panel-2); border-left: 3px solid var(--k-accent); padding: 6px 10px; line-height: 1.65; border-radius: 0 6px 6px 0; }
.dir { font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 12px; white-space: nowrap; }
.dir-good { background: color-mix(in srgb, var(--k-pos) 14%, transparent); color: var(--k-pos); }
.dir-bad { background: var(--k-hi-soft); color: var(--k-hi); }
.dir-flat { background: var(--k-lo-soft); color: var(--k-muted); }
.asof { font-size: 12px; color: var(--k-muted); display: inline-flex; align-items: center; gap: 6px; }
.s-tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 8px; border: 1px solid var(--k-line); color: var(--k-muted); line-height: 1.6; font-family: var(--body); }
.s-tag.old { border-color: var(--k-mid); color: var(--k-mid); }
.srcrow { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.s-item { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
.s-date { font-size: 11px; color: var(--k-faint); }
.base-row { display: flex; flex-wrap: wrap; gap: 8px; }
.base-note { font-size: 12px; color: var(--k-faint); margin: 0; }

.td { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.td > * { min-width: 0; }
.t-card .t-chg { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.td-head { background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.td-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.td-judg { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 700; color: var(--k-fg); line-height: 1.5; }
.td-note { margin: 0; font-size: 13px; color: var(--k-muted); }
.td-sec { background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.td-sec > h3 { margin: 0; font-size: 16px; color: var(--k-fg); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.td-sec > h3 small { font-size: 12px; color: var(--k-faint); font-weight: 400; }
.td-sec ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.td-sec li { font-size: 14px; color: var(--k-fg); line-height: 1.7; }
.td-sec li .srcrow { font-size: 12px; margin-top: 2px; }
.facts li::marker { color: var(--k-accent); }
.facts .f-h { color: var(--k-fg); font-weight: 700; }
.more-f summary { cursor: pointer; font-size: 13px; color: var(--k-accent); font-weight: 600; list-style: none; padding: 4px 0; }
.more-f summary::-webkit-details-marker { display: none; }
.more-f summary::after { content: " ▾"; }
.more-f[open] summary::after { content: " ▴"; }
.more-f > ul { margin-top: 8px; }
.basis-d { display: inline; margin-left: 6px; }
.basis-d summary { display: inline; cursor: pointer; font-size: 12px; color: var(--note-label); text-decoration: underline dotted; list-style: none; }
.basis-d summary::-webkit-details-marker { display: none; }
.basis-d[open] .basis { margin-top: 4px; }
.infs { list-style: none; padding-left: 0 !important; }
.infs li { background: var(--note-bg); color: var(--note-ink); border-radius: 6px; padding: 8px 12px; }
.basis { display: block; font-size: 12px; opacity: .8; margin-top: 2px; }
.conf { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 8px; margin-right: 6px; border: 1px solid currentColor; }
.conf-高 { color: var(--k-pos); } .conf-中 { color: var(--k-mid); } .conf-低 { color: var(--k-hi); }
.td-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ms { width: 100%; border-collapse: collapse; font-size: 13px; }
.ms th, .ms td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--k-line); vertical-align: top; }
.ms th { font-size: 12px; color: var(--k-muted); font-weight: 600; white-space: nowrap; }
.ms-wrap { overflow-x: auto; }
.imp { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--k-line); border-radius: 8px; }
.imp-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.imp p { margin: 0; font-size: 14px; color: var(--k-fg); }
.imp .mag { font-size: 12px; color: var(--k-muted); }
.ef-利好 { color: var(--k-pos); border-color: currentColor; } .ef-利空 { color: var(--k-hi); border-color: currentColor; } .ef-不确定 { color: var(--k-muted); }
.sig { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 14px; padding: 8px 0; border-bottom: 1px solid var(--k-line); }

.sig .when { font-family: var(--mono); font-size: 12px; color: var(--k-accent); }
.sig .when small { display: block; color: var(--k-muted); }
.sig .what { font-size: 14px; color: var(--k-fg); }
.sig .why { font-size: 12px; color: var(--k-muted); grid-column: 2; }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tl-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--k-line); border-left: 3px solid var(--k-lo); border-radius: 8px; }
.tl-row.lv-高 { border-left-color: var(--k-hi); } .tl-row.lv-中 { border-left-color: var(--k-mid); }
.tl-row .d { font-family: var(--mono); font-size: 12px; color: var(--k-muted); }
.tl-row h4 { margin: 0; font-size: 14px; color: var(--k-fg); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tl-row p { margin: 0; font-size: 13px; color: var(--k-fg); grid-column: 2; }
.tl-row .nx { font-size: 12px; color: var(--k-muted); grid-column: 2; }
.tl-row .srcrow { grid-column: 2; font-size: 12px; }
.st { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
.st-已生效 { background: var(--k-hi-soft); color: var(--k-hi); }
.st-征求意见 { background: var(--k-mid-soft); color: var(--k-mid); }
.st-传闻 { background: var(--k-lo-soft); color: var(--k-lo); }

/* FX */
.fx-mini { display: flex; flex-direction: column; gap: 6px; }
.fx-row { display: grid; grid-template-columns: 70px 64px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; font-size: 12px; color: var(--k-muted); }
.fx-row .fx-p { font-weight: 600; color: var(--k-fg); font-size: 13px; }
.fx-row .fx-v { font-size: 16px; font-weight: 600; color: var(--k-fg); }
.fx-row .fx-c { font-family: var(--mono); }
.fx-row .fx-b { grid-column: 2 / -1; font-size: 11px; color: var(--k-faint); }
.fxsvg .fx-line { fill: none; stroke: var(--k-accent); stroke-width: 2; }

.fxsvg .fx-hit:hover { fill: var(--k-accent); }
.fxsvg .fx-bud { stroke: var(--k-hi); stroke-width: 1.5; stroke-dasharray: 6 4; }
.fxsvg .fx-today { stroke: var(--k-faint); stroke-width: 1; stroke-dasharray: 2 3; }
.fxsvg .fx-lab { fill: var(--k-muted); font-size: 11px; }
.fx-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--k-muted); }
.fx-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--k-accent); vertical-align: middle; margin-right: 6px; }
.fx-legend i.c { border-top: 2px dashed var(--k-faint); }
.fx-legend i.f { border-top: 2px dashed var(--k-accent); }
.fx-legend i.b { border-top: 2px dashed var(--k-hi); }
.fx-bud-in { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--k-muted); }
.fx-bud-in input { width: 110px; font: inherit; font-family: var(--mono); padding: 4px 8px; border: 1px solid var(--k-line); border-radius: 6px; background: var(--k-panel-2); color: var(--k-fg); }
.fx-bud-in button { border: 1px solid var(--k-line); background: transparent; color: var(--k-muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

/* 假设视图 */
.draft { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 10px; background: var(--k-mid-soft); color: var(--k-mid); }
.h-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.h-card { text-align: left; background: var(--k-panel); border: 1px solid var(--k-line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }

  function renderMarkets(body) {
    var keys = Object.keys(D.markets || {});
    if (keys.indexOf(mTab) < 0) mTab = keys[0];
    var tabs = el("div", "tabs"); tabs.setAttribute("role", "tablist");
    keys.forEach(function (k) { var b = el("button", null, D.markets[k].name); if (marketFresh(D.markets[k])) { var td = el("span", "tdot"); td.title = "今日有更新"; b.appendChild(td); } b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(k === mTab)); b.addEventListener("click", function () { mTab = k; zone = "markets-" + k; setHash(zone); render(); }); tabs.appendChild(b); });
    body.appendChild(tabs);
    var g = el("div", "m-body"); g.style.marginTop = "14px";
    arr(D.markets[mTab].blocks).forEach(function (b) { g.appendChild(block(b)); });
    body.appendChild(g);
  }
  function renderPolicy(body) {
    var order = { "高": 0, "中": 1, "低": 2 };
    var P = arr(D.policy).slice().sort(function (a, b) { return ((fresh(a) ? 0 : 1) - (fresh(b) ? 0 : 1)) || (order[a.level] - order[b.level]) || ((a.next && a.next.date || "9") < (b.next && b.next.date || "9") ? -1 : 1); });
    var list = el("div", "p-list");
    P.forEach(function (p) {
      var r = el("article", "p-row lv-" + p.level + (fresh(p) ? " is-fresh" : "")), left = el("div"); left.style.display = "flex"; left.style.flexDirection = "column"; left.style.gap = "6px"; left.style.minWidth = "0";
      var t = el("div", "p-title"); t.appendChild(el("span", "lv lv-" + p.level, p.level + "关注")); t.appendChild(el("h3", null, p.title)); if (fresh(p)) t.appendChild(newTag()); t.appendChild(el("span", "chip", p.region)); t.appendChild(el("span", "chip", p.biz)); left.appendChild(t);
      left.appendChild(el("p", "p-status", p.status));
      if (p.latest) { var lt = el("p", "p-latest"); lt.appendChild(el("span", "mono", p.latest.date)); lt.appendChild(document.createTextNode(p.latest.text)); left.appendChild(lt); }
      r.appendChild(left);
      var nx = el("div", "p-next"); nx.appendChild(el("span", "k-label", "下一个节点"));
      var n = p.next && p.next.date ? daysTo(p.next.date) : null;
      var cd = el("span", "cd", n == null ? "待定" : n < 0 ? "已过" : String(n)); if (n != null && n >= 0) cd.appendChild(el("small", null, "天后"));
      nx.appendChild(cd); if (p.next && p.next.date) nx.appendChild(el("span", "mono", p.next.date)); nx.appendChild(el("span", null, (p.next && p.next.text) || ""));
      r.appendChild(nx);
      var sr = el("div", "p-src"); sr.appendChild(document.createTextNode("来源 ")); sr.appendChild(link(p.source && p.source.name, p.source && p.source.url)); r.appendChild(sr);
      list.appendChild(r);
    });
    body.appendChild(list);
  }
  function renderCalendar(body) {
    body.appendChild(chipBar(["全部", "财报", "发布", "政策", "行业"], cFilter, function (x) { cFilter = x; render(); }));
    var C = arr(D.calendar).filter(function (c) { return (cFilter === "全部" || c.type === cFilter) && daysTo(c.date) != null && daysTo(c.date) >= -1; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var wrap = el("div"); wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.gap = "10px"; wrap.style.marginTop = "14px";
    var groups = {};
    C.forEach(function (c) { var n = daysTo(c.date), k = n <= 6 ? "未来 7 天" : n <= 13 ? "第 2 周" : n <= 30 ? "本月内（31天内）" : "更远"; (groups[k] = groups[k] || []).push(c); });
    ["未来 7 天", "第 2 周", "本月内（31天内）", "更远"].forEach(function (k) {
      if (!groups[k]) return;
      var w = el("section", "c-week"); w.appendChild(el("h3", null, k));
      groups[k].forEach(function (c) {
        var n = daysTo(c.date), d = parseD(c.date), r = el("div", "c-row" + (n < 0 ? " past" : ""));
        var dd = el("span", "d", md(c.date)); dd.appendChild(el("small", null, WD[d.getDay()])); r.appendChild(dd);
        r.appendChild(el("span", "cd", n === 0 ? "今天" : n < 0 ? "已过" : n + "天后"));
        var t = el("span", "t", c.title); if (fresh(c)) t.appendChild(newTag("今日新增")); t.appendChild(el("small", null, c.biz + (c.confirmed === false ? " · 预计" : ""))); r.appendChild(t);
        r.appendChild(el("span", "chip ty-" + c.type, c.type));
        w.appendChild(r);
      });
      wrap.appendChild(w);
    });
    if (!C.length) wrap.appendChild(el("p", "q-orig", "近期没有这类节点。"));
    body.appendChild(wrap);
  }

  function render() {
    var body = $("ck-body"); body.replaceChildren();
    var parts = zone.split("-"), z = parts[0], sub = parts.slice(1).join("-");
    $("ck-back").hidden = z === "home"; $("ck-float").hidden = z === "home";
    var needD = z !== "home" && z !== "theme";
    if ((needD && !D) || (z === "theme" && !TH) || (z === "home" && !TH && !D)) { $("ck-sub").textContent = "正在读取数据…（如长时间没有内容，请刷新页面）"; return; }
    $("ck-title").textContent = z === "home" ? "经营看板" : z === "theme" ? ((TH.cards[sub] || {}).name || "主题") : z === "leaders" ? "关键假设 · 领袖发言" : ZONES[z] || "经营看板";
    var st = []; if (TH) st.push("主题切片截至 " + TH.asOf); if (D) st.push("每日数据更新于 " + (D.updatedAt || D.asOf) + " 北京时间");
    $("ck-sub").textContent = st.join(" · ");
    if (z === "home") renderHome(body);
    else if (z === "theme") { var c = TH.cards[sub]; if (!c) { zone = "home"; renderHome(body); return; } if (sub === "fx") renderFx(body, c); else renderTheme(body, c); }
    else if (z === "leaders") renderLeaders(body);
    else if (z === "earnings") renderEarnings(body);
    else if (z === "markets") { if (sub) mTab = sub; renderMarkets(body); }
    else if (z === "policy") renderPolicy(body);
    else if (z === "calendar") renderCalendar(body);
  }

  /* ================= routing ================= */
  var view = "news";
  function setHash(h) { try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {} }
  function showView(v) {
    view = v;
    document.body.classList.toggle("is-board", v === "board");
    $("view-news").hidden = v !== "news"; $("view-board").hidden = v !== "board";
    $("tab-news").setAttribute("aria-selected", String(v === "news")); $("tab-board").setAttribute("aria-selected", String(v === "board"));
  }
  function go(z) { zone = z; showView("board"); setHash(z === "home" ? "board" : z); render(); window.scrollTo(0, 0); }
  $("tab-news").addEventListener("click", function () { showView("news"); setHash(current && briefs.length && current !== briefs[0].date ? current : ""); window.scrollTo(0, 0); });
  $("tab-board").addEventListener("click", function () { go("home"); });
  $("ck-back").addEventListener("click", function () { go("home"); });
  $("ck-float").addEventListener("click", function () { go("home"); });

  var h = location.hash.slice(1);
  if (/^\d{4}-\d{2}-\d{2}$/.test(h)) { current = h; followLatest = false; showView("news"); }
  else if (h === "board") { zone = "home"; showView("board"); }
  else if (/^(leaders|earnings|markets|policy|calendar|theme)(-[a-z0-9]+)?$/.test(h)) { zone = h; showView("board"); }
  else showView("news");

  Promise.all([load("latest.json"), load("history.json")]).then(function (r) {
    r.forEach(function (d) { if (d) mergeNews(Array.isArray(d) ? d : [d]); });
    if (!briefs.length) showEmpty("暂时读不到简报", "请刷新页面重试。");
  });
  load("dashboard.json").then(function (d) { D = d; render(); });
  load("themes.json").then(function (t) { TH = t; render(); });
})();
</script>

</body>
</html>
